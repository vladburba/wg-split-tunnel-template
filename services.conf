# WireGuard Split-Tunnel — конструктор сервисов
#
# Формат строки: <имя_сервиса> <AS1> [AS2] [AS3] ...
# Закомментированная (#) или пустая строка — игнорируется.
#
# Как пользоваться:
#   - Чтобы включить готовый шаблон  — убери # в начале строки.
#   - Чтобы выключить включённый    — поставь # в начало строки.
#   - Чтобы добавить свой сервис    — допиши новую строку с AS-номерами.
#   - AS-номера сервисов ищите на https://bgp.tools или https://radar.cloudflare.com
#
# После любых изменений выполните:
#   ./fetch_prefixes.sh && python aggregate_prefixes.py && ./build_conf.sh

